<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons (optional) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Quiz Time!</h1>
            <div class="controls">
                <select id="week-select" aria-label="Select Week or All"></select>
                 <div class="mode-toggle">
                    <button id="mode-learn" class="mode-button active">Learning Mode</button>
                    <button id="mode-repeat" class="mode-button">Repetition Mode</button>
                </div>
                 <button id="restart-button" title="Restart Quiz"><i class="fas fa-redo"></i></button>
                <button id="theme-toggle" title="Toggle Theme"><i class="fas fa-adjust"></i></button>
            </div>
        </header>

        <main id="quiz-area">
            <div id="question-container" class="question-container">
                <h2 id="question-text">Question text appears here...</h2>
                <div id="options-container" class="options-container">
                    <!-- Option buttons will be generated here by JS -->
                </div>
                <div id="feedback-area" class="feedback-area"></div>
                <div id="repetition-progress" class="repetition-progress"></div>
                <button id="next-button" class="next-button hidden">Next Question</button>
            </div>
             <div id="completion-area" class="completion-area hidden">
                <h2>Quiz Complete!</h2>
                <p id="completion-message"></p>
                <div id="confetti-container"></div> <!-- For celebration animation -->
            </div>
        </main>
    </div>

    <!-- Load questions data first -->
    <script src="questions.js"></script>
    <!-- Load the main script -->
    <script src="script.js"></script>
</body>
</html>
